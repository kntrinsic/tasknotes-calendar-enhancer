name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"

      - name: Verify tag matches manifest, package, and versions metadata
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.GITHUB_REF_NAME;
            if (!tag) {
              throw new Error("Missing GITHUB_REF_NAME");
            }
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            if (manifest.version !== tag) {
              throw new Error(`manifest.json version (${manifest.version}) does not match tag (${tag})`);
            }
            if (pkg.version !== tag) {
              throw new Error(`package.json version (${pkg.version}) does not match tag (${tag})`);
            }
            if (!Object.prototype.hasOwnProperty.call(versions, tag)) {
              throw new Error(`versions.json does not contain entry for tag (${tag})`);
            }
            console.log(`Verified release version ${tag}`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify plugin release artifacts
        run: test -s manifest.json && test -s main.js && test -s styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            manifest.json
            main.js
            styles.css
